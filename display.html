<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STI-OPOLY — Live Host Board</title><style>
*{box-sizing:border-box}body{margin:0;background:#d6e6d7;color:#1b2b20;font-family:system-ui,'Segoe UI',sans-serif}header{background:#d12232;color:white;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:clamp(22px,3vw,38px)}button{background:#205b44;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:bold}input{padding:10px;border-radius:6px;border:1px solid #9cafa0;text-transform:uppercase;letter-spacing:2px}.layout{display:grid;grid-template-columns:minmax(560px,1fr) minmax(230px,310px);gap:18px;padding:16px;max-width:1600px;margin:auto}.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));aspect-ratio:1;border:5px solid #253e31;background:#d2e5d5;box-shadow:0 8px 22px #263d3040}.tile{border:1px solid #343434;background:#fffdf6;position:relative;text-align:center;font-size:clamp(6px,.85vw,12px);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:2px;overflow-wrap:anywhere}.stripe{height:18%;min-height:5px;width:100%}.tokens{font-size:clamp(9px,1.2vw,18px);line-height:1.2}.center{grid-column:2/11;grid-row:2/11;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(#f3faf1,#b8d8c0);padding:14px}.center strong{font-size:clamp(34px,5.6vw,90px);color:#c51d30;transform:rotate(-8deg);text-shadow:2px 2px #fff}.center p{font-size:clamp(14px,1.7vw,26px)}.panel{background:#fffef8;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px #263d3019}.panel h2{margin:0 0 10px;font-size:21px}.person{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #e5e8df;font-size:14px}.active{background:#d8f1dc;border-radius:5px;font-weight:bold}.muted{color:#566d5d;font-size:13px}.leader{display:flex;justify-content:space-between;padding:10px 3px;border-bottom:1px solid #ddd}.status{font-weight:bold;font-size:18px}.log{font-size:12px;max-height:220px;overflow:auto}.log p{margin:6px 0;border-bottom:1px solid #eee;padding-bottom:5px}#setup{max-width:480px;margin:60px auto}#error{color:#a82430}.hide{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr}.board{max-width:850px;width:100%;margin:auto}.tile{font-size:clamp(6px,1.3vw,11px)}}@media(max-width:550px){.layout{padding:5px;gap:6px}.board{border-width:2px}.tile{font-size:5px;padding:1px}.tokens{font-size:8px}}
</style></head><body><header><h1>🦠 STI-OPOLY · HOST DISPLAY</h1><span id="roomLabel">Spectator mode · 0 player slots used</span></header><section id="setup" class="panel"><h2>Connect the classroom screen</h2><p>Enter the room code to show the live board on this computer, TV, or projector. Players still take turns on their own laptops.</p><form id="connectForm"><input id="roomCode" maxlength="6" placeholder="ROOM CODE" required><button>Show board</button></form><p id="error"></p></section><main id="main" class="layout hide"><section><div id="board" class="board"></div></section><aside><div class="panel"><h2>🎲 Current turn</h2><div id="status" class="status"></div><p id="dice"></p><p id="phase" class="muted"></p></div><div class="panel"><h2>👥 Players</h2><div id="players"></div></div><div id="resultsPanel" class="panel hide"><h2>🏆 Final leaderboard</h2><div id="results"></div></div><div class="panel"><h2>Game activity</h2><div id="log" class="log"></div></div></aside></main><script src="/socket.io/socket.io.js"></script><script src="/display.js"></script></body></html>
